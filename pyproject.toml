[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-brief"
version = "0.0.0"
description = "GitHub Action that writes one concise, safe, always-up-to-date PR brief comment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["github-action", "pull-request", "llm", "code-review"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mehmetalicann/pr-brief"
Issues = "https://github.com/mehmetalicann/pr-brief/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "mypy>=1.11",
    "pip-tools>=7.4",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "rust-just>=1.30",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pr_brief"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF001"]
# Turkish text contains the dotless i, which RUF001 flags as ambiguous.
"src/pr_brief/core/i18n.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
markers = ["live: calls a real LLM; skipped unless RUN_LIVE=1"]

[tool.coverage.run]
source = ["src/pr_brief"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
