name: PR Brief Trial

# TEMPORARY. Real-runner trial of `/pr-brief refresh` (docs/refresh.md). Comment events only run the
# workflow from the default branch, so it has to live on main for the trial. Removed right after.
# The action is pinned to the commit that contains the feature (v1 does not have it yet).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  brief:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
      github.event.comment.body == '/pr-brief refresh' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association))
    concurrency:
      group: pr-brief-trial-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: mehmetalicann/pr-brief@8c1b13df40ed339a9ff2f16bb2134fc45337eeb0  # 1.2.0 prep, trial only
        with:
          provider: gemini
          model: gemini-3.5-flash-lite
          api-key: ${{ secrets.LLM_API_KEY }}
